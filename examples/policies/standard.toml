# The built-in "standard" preset, written out as a file so it can be read,
# edited and version-controlled alongside a project.
#
# This is the intended starting point for a project-specific policy: copy it to
# something like `.sentinel/policy.toml`, then narrow it. A test asserts that
# this file stays identical to the preset in `agent_sentinel/policy/presets.py`.
#
# Check it without running anything:
#   sentinel policy check --policy examples/policies/standard.toml --target "rm -rf /"

schema      = 1
name        = "standard"
description = "Block the catastrophic, escalate the risky, allow the rest. The recommended starting point for a supervised coding agent."
default     = "allow"

[[rules]]
id       = "shell.rm-root"
kind     = "shell"
effect   = "deny"
priority = 10
pattern  = '''(?i)\brm\s+(?:-[^\s]+\s+)*(?:/|/\*|~|\$HOME)(?:\s|$)'''
reason   = "recursive delete of a root or home directory"
tags     = ["destructive"]

[[rules]]
id       = "shell.pipe-remote-to-shell"
kind     = "shell"
effect   = "deny"
priority = 10
pattern  = '''(?i)\b(?:curl|wget|iwr|Invoke-WebRequest)\b[^|;&]*\|\s*(?:sudo\s+)?(?:ba|z|da|k)?sh\b'''
reason   = "piping a downloaded script straight into a shell"
tags     = ["supply-chain"]

[[rules]]
id       = "shell.disk-destroy"
kind     = "shell"
effect   = "deny"
priority = 10
pattern  = '''(?i)\b(?:mkfs(?:\.[a-z0-9]+)?\s|dd\s+if=[^\s]+\s+of=/dev/|shred\s+/dev/)'''
reason   = "writing to a raw disk device"
tags     = ["destructive"]

[[rules]]
id       = "shell.host-power"
kind     = "shell"
effect   = "deny"
priority = 10
pattern  = '''(?i)(?:^|[;&|]\s*)(?:shutdown|reboot|halt|poweroff)\b'''
reason   = "powering the machine off"
tags     = ["destructive"]

[[rules]]
id       = "fs.path-traversal"
kind     = ["file.write", "file.delete"]
effect   = "deny"
priority = 10
pattern  = '''(?:^|/)\.\.(?:/|$)'''
reason   = "path escapes the workspace through '..'"
tags     = ["filesystem", "escape"]

[[rules]]
id       = "fs.git-internals"
kind     = ["file.write", "file.delete"]
effect   = "deny"
priority = 10
pattern  = '''(?:^|/)\.git/'''
reason   = "editing git internals directly instead of using git"
tags     = ["filesystem"]

[[rules]]
id       = "shell.git-force-push"
kind     = "shell"
effect   = "review"
priority = 50
pattern  = '''(?i)\bgit\s+push\b[^\n]*(?:--force(?:-with-lease)?\b|\s-f(?:\s|$))'''
reason   = "force pushing rewrites shared history"
tags     = ["git"]

[[rules]]
id       = "shell.git-history-rewrite"
kind     = "shell"
effect   = "review"
priority = 50
pattern  = '''(?i)\bgit\s+(?:reset\s+--hard|clean\s+-[a-z]*f|checkout\s+--\s|branch\s+-D\b)'''
reason   = "this discards uncommitted or unreferenced work"
tags     = ["git", "destructive"]

[[rules]]
id       = "shell.privilege-escalation"
kind     = "shell"
effect   = "review"
priority = 50
pattern  = '''(?i)(?:^|[;&|]\s*)(?:sudo|doas|runas)\b'''
reason   = "escalating privileges"
tags     = ["privilege"]

[[rules]]
id       = "shell.package-install"
kind     = "shell"
effect   = "review"
priority = 50
pattern  = '''(?i)\b(?:pip|pip3|npm|pnpm|yarn|apt(?:-get)?|brew|choco|winget)\s+(?:install|add|i)\b'''
reason   = "installing a dependency changes the build environment"
tags     = ["supply-chain"]

[[rules]]
id       = "fs.secrets"
kind     = "file.write"
effect   = "review"
priority = 50
pattern  = '''(?:^|/)(?:\.env(?:\.[^/]*)?|id_rsa|id_ed25519|\.netrc|\.aws/credentials)(?:$|/)'''
reason   = "writing to a file that normally holds credentials"
tags     = ["secrets"]

[[rules]]
id       = "shell.credential-access"
kind     = "shell"
effect   = "review"
priority = 50
pattern  = '''(?i)(?:id_rsa|id_ed25519|\.ssh/|\.aws/credentials|\.netrc|security\s+find-generic-password)'''
reason   = "reading credential material"
tags     = ["secrets"]

[[rules]]
id       = "shell.data-upload"
kind     = "shell"
effect   = "review"
priority = 50
pattern  = '''(?i)\b(?:curl|wget|iwr|Invoke-WebRequest)\b[^\n]*(?:--data\b|-d\s|--upload-file\b|-T\s|--post-file\b|-F\s)'''
reason   = "uploading data to a remote endpoint"
tags     = ["exfiltration"]

[[rules]]
id       = "network.any"
kind     = "network"
effect   = "review"
priority = 90
pattern  = '''(?s).+'''
reason   = "every network destination is reviewed by default"
tags     = ["network"]
